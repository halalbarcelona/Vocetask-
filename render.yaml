services:
  - type: web
    name: review-agent
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false          # you paste this in the Render dashboard
      - key: APP_PASSWORD
        generateValue: true  # login password for the dashboard (shown in Render env vars)
      - key: INGEST_TOKEN
        generateValue: true
