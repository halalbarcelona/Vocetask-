<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4b3fd4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura Task" />
    <link rel="apple-touch-icon" href="/Vocetask-/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/Vocetask-/icons/favicon-48.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Aura Task</title>
    <script>
      // Applies the saved theme before first paint so a dark-mode user
      // doesn't get a flash of the light palette on every load.
      try {
        var t = localStorage.getItem('aura-theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
