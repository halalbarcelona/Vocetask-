<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Agent</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#6b7385;--line:#e3e6ec;--accent:#2f6fed;--good:#1a8f4c;--warn:#c47a00;--bad:#c93232}
  @media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b1f29;--ink:#e8ebf2;--mute:#9099ad;--line:#2a2f3c;--accent:#6b9bff}}
  *{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line);background:var(--card)}
  h1{font-size:18px;margin:0}main{max-width:820px;margin:0 auto;padding:16px}
  .badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  button{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.active{border-color:var(--accent);color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.meta{color:var(--mute);font-size:13px}
  .stars{color:#e0a100;letter-spacing:1px}textarea,input,select{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  textarea{min-height:84px;margin:8px 0}.pill{font-size:12px;padding:1px 8px;border-radius:99px}
  .s-needs_attention{background:#fde8e8;color:var(--bad)}.s-pending_approval{background:#fff3d9;color:var(--warn)}.s-published{background:#dff5e8;color:var(--good)}.s-new,.s-ignored,.s-analyzing{background:var(--bg);color:var(--mute)}
  .warn{color:var(--bad);font-size:13px;margin:6px 0}label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
  details{margin-bottom:14px}summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header>
  <div><h1>Review Agent</h1><span class="meta" id="biz"></span></div>
  <div class="row"><span class="badge" id="mode"></span>
    <label class="row" style="margin:0"><input type="checkbox" id="auto" style="width:auto"> Autopilot (auto-reply to happy reviews)</label></div>
</header>
<main>
  <div class="row" style="margin-bottom:12px">
    <button class="primary" id="runAll">Process new reviews</button>
    <button id="addBtn">+ Add review</button>
  </div>
  <div id="addForm" class="card" hidden>
    <div class="row"><input id="a_author" placeholder="Author" style="flex:1"><select id="a_platform" style="flex:1"><option>Google</option><option>Yelp</option><option>TripAdvisor</option><option>Facebook</option></select>
    <select id="a_rating" style="width:90px"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>
    <textarea id="a_text" placeholder="Review text"></textarea><button class="primary" id="a_go">Add &amp; analyze</button>
  </div>
  <details><summary>Business voice &amp; policies</summary>
    <div class="card" id="bizForm"></div></details>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let state, filter = "needs_attention";
const TABS = [["needs_attention", "Needs you"], ["pending_approval", "Ready to approve"], ["new", "New"], ["published", "Published"], ["all", "All"]];
const FIELDS = [["name", "Business name"], ["about", "About"], ["voice", "Reply voice"], ["signoff", "Sign-off"], ["contact", "How unhappy customers reach you"], ["policies", "Policies (refunds, etc.)"]];

async function api(path, method = "GET", body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
async function load() { state = await api("/api/state"); render(); }

function render() {
  $("#biz").textContent = state.business.name;
  $("#mode").textContent = state.live ? "Claude · " + state.model : "Demo mode (no API key)";
  $("#auto").checked = state.settings.autopilot;
  $("#tabs").innerHTML = TABS.map(([k, l]) => {
    const n = k === "all" ? state.reviews.length : state.reviews.filter((r) => r.status === k).length;
    return `<button data-t="${k}" class="${k === filter ? "active" : ""}">${l} (${n})</button>`;
  }).join("");
  const rows = state.reviews.filter((r) => filter === "all" || r.status === filter);
  $("#list").innerHTML = rows.length ? rows.map(card).join("") : '<p class="meta">Nothing here.</p>';
  if (!$("#bizForm").dataset.ready) {
    $("#bizForm").innerHTML = FIELDS.map(([k, l]) => `<label>${l}<textarea data-b="${k}" style="min-height:44px">${esc(state.business[k])}</textarea></label>`).join("") + '<button id="saveBiz" class="primary">Save</button>';
    $("#bizForm").dataset.ready = 1;
  }
}

function card(r) {
  const a = r.analysis, editable = r.draft != null && r.status !== "published" && r.status !== "ignored";
  return `<div class="card" data-id="${r.id}">
    <div class="row" style="justify-content:space-between"><div><b>${esc(r.author)}</b> <span class="stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span>
      <span class="meta">${esc(r.platform)}</span></div><span class="pill s-${r.status}">${r.status.replace("_", " ")}</span></div>
    <p>${esc(r.text)}</p>
    ${a ? `<div class="meta">${esc(a.sentiment)} · urgency ${esc(a.urgency)}${a.topics?.length ? " · " + a.topics.map(esc).join(", ") : ""}${a.source !== "claude" ? " · " + a.source : ""}</div>` : ""}
    ${a?.needs_human ? `<div class="warn">⚠ ${esc(a.escalation_reason)}</div>` : ""}
    ${editable ? `<textarea data-draft>${esc(r.draft)}</textarea><div class="row">
      <button class="primary" data-act="approve">Approve &amp; publish</button><button data-act="regenerate">Redraft</button><button data-act="reject">Ignore</button></div>` : ""}
    ${r.status === "published" ? `<div class="meta" style="margin-top:8px">Reply${r.published?.mode === "simulated" ? " (simulated)" : ""}: ${esc(r.publishedReply)}</div>` : ""}
    ${r.status === "new" ? `<button data-act="regenerate">Analyze</button>` : ""}
  </div>`;
}

document.addEventListener("click", async (e) => {
  const t = e.target;
  try {
    if (t.dataset.t) { filter = t.dataset.t; return render(); }
    if (t.id === "addBtn") $("#addForm").hidden = !$("#addForm").hidden;
    if (t.id === "runAll") { t.disabled = true; t.textContent = "Working…"; await api("/api/process-all", "POST"); t.disabled = false; t.textContent = "Process new reviews"; await load(); }
    if (t.id === "a_go") {
      t.disabled = true;
      await api("/api/reviews", "POST", { author: $("#a_author").value, platform: $("#a_platform").value, rating: +$("#a_rating").value, text: $("#a_text").value });
      t.disabled = false; $("#a_text").value = ""; $("#addForm").hidden = true; await load();
    }
    if (t.id === "saveBiz") {
      const business = {}; document.querySelectorAll("[data-b]").forEach((x) => (business[x.dataset.b] = x.value));
      await api("/api/settings", "PUT", { business }); await load();
    }
    if (t.dataset.act) {
      const card = t.closest(".card"), id = card.dataset.id;
      if (t.dataset.act === "approve") await api(`/api/reviews/${id}/draft`, "POST", { draft: card.querySelector("[data-draft]").value });
      t.disabled = true; await api(`/api/reviews/${id}/${t.dataset.act}`, "POST"); await load();
    }
  } catch (err) { alert(err.message); await load(); }
});
$("#auto").addEventListener("change", async (e) => { await api("/api/settings", "PUT", { settings: { autopilot: e.target.checked } }); await load(); });
load();
</script>
</body>
</html>
